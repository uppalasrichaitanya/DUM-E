appId: com.dume.hub
productName: DUM-E
copyright: Copyright © 2026 DUM-E

# Internal tool: no public update feed yet. Auto-update is disabled in the app
# (src/main/updater.ts); when DUM-E gets its own releases, point this at the
# team repo and re-enable the updater.

# Register the dum-e:// URL scheme (shareable-hires deep link) in the packaged
# app: CFBundleURLTypes on macOS, registry entries via NSIS on Windows.
protocols:
  - name: DUM-E
    schemes:
      - dum-e

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # v0.3.4: shipped so the voice get_app_info tool can read release notes.
  - CHANGELOG.md
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"

# Ship the standalone Slack reply helper as a plain file under the app's
# resources dir (process.resourcesPath). It runs under `node`, NOT inside the
# asar, so the lab worker can invoke `node <resources>/md-slack-reply.cjs`.
extraResources:
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  # Knowledge Graph agent CLI + its pure-JS core. Agents invoke `node
  # <resources>/kg.cjs` out-of-process; kg-core.cjs ships beside it so the CLI's
  # `require('./kg-core.cjs')` resolves outside the asar.
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  # Bundled default skills (read-only/no-secret). copyBundledSkills() reads these
  # from skillsResourceDir() = <process.resourcesPath>/skills in the packaged app
  # and refreshes each agent's .claude/skills/ per spawn (dev resolves to
  # repo resources/skills). Directory copy preserves the <id>/SKILL.md tree.
  - from: resources/skills
    to: skills

asarUnpack:
  - "**/node_modules/node-pty/**"
  # better-sqlite3 is native (bindings/prebuild need the .node on the real FS).
  - "**/node_modules/better-sqlite3/**"

# Native deps ship PREBUILT, not rebuilt at package time:
#  - node-pty is N-API (its win32 prebuilds work under Electron as-is)
#  - better-sqlite3 was rebuilt for Electron's ABI by tools/postinstall.cjs
# A package-time `electron-rebuild -f` would try node-pty from source, which
# needs the Spectre-mitigated MSVC libs many machines lack (MSB8040) — and
# would produce nothing better than the working prebuilds we already have.
# If a fresh checkout builds the app elsewhere, run `npm install` first
# (postinstall handles the better-sqlite3 rebuild + verification).
npmRebuild: false

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Declare WHY the app touches the user's folders. macOS shows these strings in
  # the privacy prompt and, for a signed app, remembers the grant — so the user
  # is asked ONCE instead of on every agent action.
  extendInfo:
    NSDocumentsFolderUsageDescription: "DUM-E runs your coding agents, which read and write files in the project folders you point them at."
    NSDesktopFolderUsageDescription: "DUM-E's agents may work on projects located on your Desktop."
    NSDownloadsFolderUsageDescription: "DUM-E's agents may work on projects located in your Downloads."
    NSRemovableVolumesUsageDescription: "DUM-E's agents may work on projects located on external volumes."
    NSNetworkVolumesUsageDescription: "DUM-E's agents may work on projects located on network volumes."
    # The microphone is used by two opt-in, off-by-default voice features: Free
    # Flow dictation (Groq transcription) and talking to the orchestrator in
    # real time (OpenAI). Mic access only happens while one is on.
    NSMicrophoneUsageDescription: "DUM-E uses your microphone only for its opt-in voice features: Free Flow dictation (transcribed by Groq into the message queue) and talking to the orchestrator in real time (streamed to OpenAI). The mic is off unless you turn one of these on."
  # Hardened runtime + entitlements so the spawned agents inherit this app's
  # TCC responsibility (one grant covers them all) and node-pty can load.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Signing: TCC binds a remembered grant to a STABLE code signature, so a signed
  # build is asked for folder access ONCE. The "Developer ID Application" cert is
  # auto-discovered from the login keychain (CSC_IDENTITY_AUTO_DISCOVERY). If no
  # cert is found, electron-builder warns and produces an unsigned build, so
  # contributors without an Apple account can still build.
  #   To sign: install your "Developer ID Application" cert into the keychain.
  #   (Override with CSC_LINK=<path-to.p12> + CSC_KEY_PASSWORD for CI.)
  # Notarization happens in the root-level `afterSign: build/notarize.cjs` hook.
  notarize: false
  # dmg is what humans download; zip is what Squirrel.Mac (electron-updater)
  # actually updates from — latest-mac.yml points at it. Both universal.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: DUM-E-${version}-mac-${arch}.${ext}

dmg:
  title: DUM-E ${version}

# ---- Windows ----
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: DUM-E-${version}-win-x64-setup.exe
  shortcutName: DUM-E

portable:
  artifactName: DUM-E-${version}-win-x64-portable.exe

# ---- Linux ----
linux:
  category: Development
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: DUM-E-${version}-linux-x86_64.AppImage
