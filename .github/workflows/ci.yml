name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    name: Typecheck + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two platforms DUM-E ships for.
        os: [windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp (used to rebuild better-sqlite3) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 + setuptools, same as release.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (node + web)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (electron-vite → out/)
        run: npm run build
